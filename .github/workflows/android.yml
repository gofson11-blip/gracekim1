name: Android APK 빌드

on:
  push:
    paths:
      - "gracekim/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gracekim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 사주 엔진 테스트 + APK 빌드 (테스트용·출시용)
        run: ./gradlew :saju-core:test :app:assembleDebug :app:assembleRelease --stacktrace

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: saju-app-debug-apk
          path: gracekim/app/build/outputs/apk/debug/*.apk

      - name: 휴대폰 다운로드용 릴리스 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk saju-app.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest saju-app.apk \
            --target "${{ github.sha }}" \
            --title "사주사랑 최신 버전" \
            --notes "휴대폰에서 saju-app.apk 를 눌러 내려받은 뒤 설치하세요. (브랜치: ${{ github.ref_name }})"
