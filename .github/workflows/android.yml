name: Android APK 빌드

on:
  push:
    paths:
      - "gracekim/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gracekim
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 사주 엔진 테스트 + 디버그 APK 빌드
        run: ./gradlew :saju-core:test :app:assembleDebug --stacktrace

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: saju-app-debug-apk
          path: gracekim/app/build/outputs/apk/debug/*.apk
