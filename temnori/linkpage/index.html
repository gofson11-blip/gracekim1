<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>템노리 살림템 링크</title>
<meta name="description" content="템노리 영상에 나온 살림템 모아보기">
<meta property="og:title" content="템노리 살림템 링크">
<meta property="og:description" content="영상에 나온 살림템, 여기 다 모아뒀어요">
<meta property="og:image" content="img/banner.jpg">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fbf7ef; --line:#e6ddcd; --ink:#2b2622; --sub:#7a7066; --orange:#e2611b; --tape:rgba(255,163,77,.85); --memo:#fff3a8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background-color:var(--paper); color:var(--ink);
    background-image:repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px);
    font-family:'Gowun Dodum','Noto Sans KR',sans-serif; line-height:1.5;
    min-height:100vh;
  }
  .wrap { max-width:480px; margin:0 auto; padding:16px 16px 40px; }
  header { text-align:center; margin-bottom:22px; }
  .banner { display:block; width:100%; height:auto; border-radius:14px; box-shadow:0 2px 0 #2b262214; }
  .profile { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; }
  .logo { width:56px; height:56px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .pname { text-align:left; line-height:1.25; }
  .pname b { font-family:'Do Hyeon',sans-serif; font-weight:400; font-size:22px; }
  .pname span { display:block; font-size:13px; color:var(--sub); }
  .hand { font-family:'Gaegu',cursive; font-weight:700; color:var(--orange); font-size:22px; margin-top:12px; display:block; }
  .sub { color:var(--sub); font-size:15px; margin-top:4px; }
  .sns { display:flex; justify-content:center; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .sns a { font-size:14px; color:var(--ink); text-decoration:none; border:1.5px solid var(--ink); border-radius:20px; padding:4px 12px; background:#fff; }

  .notice {
    background:var(--memo); transform:rotate(-.8deg); padding:12px 14px; font-size:13px; color:#5a4f2a;
    box-shadow:2px 3px 0 rgba(0,0,0,.07); margin-bottom:22px;
  }
  .label { font-family:'Gaegu',cursive; font-weight:700; font-size:22px; color:var(--orange); margin:6px 0 10px; }

  .item {
    display:flex; gap:12px; align-items:center; background:#fff; border:1.5px solid #2b262222;
    border-radius:14px; padding:10px; margin-bottom:12px; text-decoration:none; color:inherit;
    box-shadow:0 2px 0 #2b262214; transition:transform .1s;
  }
  .item:active { transform:scale(.98); }
  .item img { width:76px; height:76px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#eee; }
  .meta { flex:1; min-width:0; }
  .tag { font-size:12px; color:var(--orange); font-weight:bold; }
  .new { display:inline-block; background:var(--orange); color:#fff; font-size:11px; border-radius:6px; padding:0 6px; margin-left:4px; vertical-align:1px; }
  .name { font-size:16px; font-weight:bold; margin:2px 0; word-break:keep-all; }
  .desc { font-size:13px; color:var(--sub); word-break:keep-all; }
  .go { font-family:'Gaegu',cursive; font-weight:700; font-size:20px; color:var(--orange); flex-shrink:0; }

  footer { margin-top:26px; font-size:12px; color:var(--sub); text-align:center; line-height:1.7; }
  footer .hand { font-size:18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="banner" src="img/banner.jpg" alt="템노리 TEMNORI - 생활 속 괜찮은 아이템을 쉽고 빠르게" width="1200" height="438">
    <div class="profile">
      <img class="logo" src="img/logo.png" alt="템노리 로고" width="56" height="56">
      <div class="pname"><b>템노리</b><span>@temnori.shop</span></div>
    </div>
    <span class="hand">영상에 나온 살림템, 여기 다 모아뒀어요</span>
    <p class="sub">월·수·금 12시에 새 살림템이 올라와요</p>
    <nav class="sns">
      <a href="https://www.instagram.com/temnori.shop/" target="_blank" rel="noopener">인스타그램</a>
      <a href="https://www.tiktok.com/@temnori.shop" target="_blank" rel="noopener">틱톡</a>
      <a href="https://www.threads.com/@temnori.shop" target="_blank" rel="noopener">스레드</a>
    </nav>
  </header>

  <p class="notice">이 페이지의 상품 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다. 가격은 쿠폰과 시기에 따라 바뀔 수 있어요.</p>

  <p class="label">최근 영상 순서예요 ↓</p>
  <main id="list"></main>

  <footer>
    <span class="hand">찾는 살림템이 없으면 댓글로 알려주세요ㅎㅎ</span>
    <p>© 템노리 · @temnori.shop</p>
  </footer>
</div>

<script>
// 회차 목록 — 새 회차는 맨 아래에 추가하면 날짜순으로 자동 정렬됩니다.
// date: 게시 날짜·시각(한국 시간). 이 시각이 지나야 페이지에 나타납니다.
const ITEMS = [
  { ep:1, date:"2026-11-09T20:00", name:"정사각 실리콘 배수구 거름망 2개입", desc:"욕실·세면대·싱크대 배수구 머리카락 걱정 끝", img:"img/ep01.jpg", url:"https://link.coupang.com/a/iv21KdyH7c" },
  { ep:2, date:"2026-11-10T12:00", name:"무선 전동 욕실 청소기", desc:"허리 안 숙이고 벽·바닥까지, 브러시 교체형", img:"img/ep02.jpg", url:"https://link.coupang.com/a/iwTJ45MD9M" },
  { ep:3, date:"2026-11-11T12:00", name:"에브리봇 엣지2 물걸레 로봇청소기", desc:"낮은 높이로 소파 밑까지 물걸레질", img:"img/ep03.jpg", url:"https://link.coupang.com/a/gLXEUZ5vy0" },
  { ep:4, date:"2026-11-13T12:00", name:"벤트론스 침구 청소기 (UV·듀얼브러시)", desc:"이불·소파·쿠션 먼지를 쓱 밀어서", img:"img/ep04.jpg", url:"https://link.coupang.com/a/iy2S9jyhlk" },
  { ep:5, date:"2026-11-16T12:00", name:"한누네 냉장고 정리함 4개 세트", desc:"국내생산, 손잡이로 쏙 꺼내 쓰는 정리함", img:"img/ep05.jpg", url:"https://link.coupang.com/a/iBM63LdPNs" },
  { ep:6, date:"2026-11-18T12:00", name:"조앤제이 국산 김장매트", desc:"테두리 있어서 양념 안 튀어요, 10~100포기 사이즈", img:"img/ep06.jpg", url:"https://link.coupang.com/a/iEpUmrKynk" }
];

(function render() {
  const now = Date.now();
  const kst = d => new Date(d + ":00+09:00").getTime();
  const shown = ITEMS.filter(i => kst(i.date) <= now).sort((a, b) => kst(b.date) - kst(a.date));
  const list = document.getElementById("list");
  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  list.innerHTML = shown.map((i, idx) => `
    <a class="item" href="${i.url}" target="_blank" rel="noopener sponsored">
      <img src="${i.img}" alt="${esc(i.name)}" loading="lazy">
      <div class="meta">
        <div class="tag">살림템 #${i.ep}${idx === 0 ? '<span class="new">NEW</span>' : ''}</div>
        <div class="name">${esc(i.name)}</div>
        <div class="desc">${esc(i.desc)}</div>
      </div>
      <span class="go">→</span>
    </a>`).join("");
})();
</script>
</body>
</html>
