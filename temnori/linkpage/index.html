<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>템노리 살림템 링크</title>
<meta name="description" content="템노리 영상에 나온 살림템 모아보기">
<meta property="og:title" content="템노리 살림템 링크">
<meta property="og:description" content="영상에 나온 살림템, 여기 다 모아뒀어요">
<meta property="og:image" content="img/banner.jpg">
<link rel="icon" href="img/icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e2611b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="템노리">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Gowun+Dodum&family=Do+Hyeon&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="top"></div>

  <p class="notice">이 페이지의 상품 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다. 가격은 쿠폰과 시기에 따라 바뀔 수 있어요.</p>

  <p class="label">영상에 나온 살림템이에요 ↓</p>
  <div class="chips" id="chips"></div>
  <main id="list"></main>

  <footer>
    <span class="hand">찾는 살림템이 없으면 댓글로 알려주세요ㅎㅎ</span>
    <p>월·수·금 12시에 새 살림템이 올라와요</p>
    <p>© 템노리 · @temnori.shop</p>
  </footer>
</div>

<script src="data.js"></script>
<script>
renderTop("index.html");
const shown = released(ITEMS);
const newest = shown.length ? shown[0].ep : null;
let cur = "전체";

function drawChips() {
  const used = CATS.filter(c => shown.some(i => i.cats.includes(c)));
  document.getElementById("chips").innerHTML = ["전체", ...used].map(c =>
    `<button class="chip${c===cur?' on':''}" data-c="${c}">${c}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { cur = b.dataset.c; drawChips(); drawList(); });
}
function drawList() {
  const list = cur === "전체" ? shown : shown.filter(i => i.cats.includes(cur));
  document.getElementById("list").innerHTML = list.length ? list.map(i => `
    <a class="item" href="${i.url}" target="_blank" rel="noopener sponsored">
      <img src="${i.img}" alt="${esc(i.name)}" loading="lazy">
      <div class="meta">
        <div class="tag">살림템 #${i.ep}${i.ep===newest ? '<span class="new">NEW</span>' : ''}</div>
        <div class="name">${esc(i.name)}</div>
        <div class="desc">${esc(i.desc)}</div>
      </div>
      <span class="go">→</span>
    </a>`).join("") : '<p class="empty">아직 이 카테고리 살림템이 없어요</p>';
}
drawChips(); drawList();
</script>
</body>
</html>
